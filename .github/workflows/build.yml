name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build app
        run: scripts/build.sh

      - name: Build DMG
        run: scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OpenEar-${{ env.VERSION }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Download **OpenEar-${{ env.VERSION }}.dmg** below, open it and drag OpenEar to Applications.

            macOS blocks the app the first time because it isn't notarized. See [First launch](https://github.com/TheBikramLama/OpenEars#first-launch) for the one-time steps.

            ![First launch walkthrough](https://raw.githubusercontent.com/TheBikramLama/OpenEars/main/assets/install-guide.gif)
